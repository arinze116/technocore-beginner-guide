name: Signing helper tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  signing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile signing helper
        run: python -m py_compile sign.py
